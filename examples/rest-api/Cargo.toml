[package]
name = "rest-api"
description = "Versioned REST API example showcasing Djangors 0.12 features (API keys, versioning, OpenAPI, health checks, CORS, resilience, distributed locks, and transactional outbox)"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
name = "rest_api"
path = "src/lib.rs"

[[bin]]
name = "rest-api"
path = "src/main.rs"

[dependencies]
djangors = { path = "../../crates/djangors", default-features = false, features = ["sqlite", "rest", "tasks", "cache", "resilience"] }
djangors-macros = { path = "../../crates/djangors-macros" }
tokio = { version = "1.53.0", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4.45", features = ["std", "serde"] }
