[package]
name = "minimal-facade"
description = "Minimal Postgres-only facade app for measuring trimmed Djangors binary size"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[[bin]]
name = "minimal-facade"
path = "src/main.rs"

[dependencies]
djangors = { path = "../../crates/djangors", default-features = false, features = ["postgres"] }
djangors-macros = { path = "../../crates/djangors-macros" }
tokio = { version = "1.53.0", default-features = false, features = ["rt-multi-thread", "macros"] }
chrono = { version = "0.4.45", features = ["std"] }
