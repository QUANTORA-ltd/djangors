[package]
name = "djangors-staticfiles"
description = "Static files support for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "staticfiles", "assets", "serving"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["s3", "postgres", "sqlite"]
postgres = ["djangors-core/postgres"]
sqlite = ["djangors-core/sqlite"]
s3 = ["dep:s3"]
clamav = ["tokio/net", "tokio/io-util"]

[dependencies]
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
djangors-core = { path = "../djangors-core", version = "0.7.0", default-features = false }
sha2 = "0.10.9"
hyper = "1.10"
async-trait = "0.1.86"
tokio = { version = "1.53.0", features = ["rt"] }
s3 = { version = "0.1.36", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.0", features = ["full"] }
bytes = "1.12"
