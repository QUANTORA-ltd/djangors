[package]
name = "djangors-contrib-guardian"
description = "Object-level permissions for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "guardian", "object-perm", "acl"]
categories = ["authentication"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-auth/postgres", "djangors-db/postgres", "djangors-orm/postgres"]
sqlite = ["djangors-auth/sqlite", "djangors-db/sqlite", "djangors-orm/sqlite"]

[dependencies]
djangors-auth = { path = "../djangors-auth", version = "0.7.0", default-features = false }
djangors-db = { path = "../djangors-db", version = "0.7.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "0.7.0" }
djangors-orm = { path = "../djangors-orm", version = "0.7.0", default-features = false }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
djangors-core = { path = "../djangors-core" }
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
chrono = "0.4"
