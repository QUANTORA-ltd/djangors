[package]
name = "djangors-contrib-history"
description = "Model history for Djangors: records every create, update, and delete of chosen models"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "history", "audit", "versioning"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-orm/postgres", "djangors-db/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-db/sqlite"]

[dependencies]
chrono = { version = "0.4", features = ["std"] }
djangors-db = { path = "../djangors-db", version = "0.13.0", default-features = false }
djangors-orm = { path = "../djangors-orm", version = "0.13.0", default-features = false }
serde_json = "1.0.150"
tracing = "0.1.44"

[dev-dependencies]
djangors-macros = { path = "../djangors-macros", version = "0.13.0" }
tokio = { version = "1.53.0", features = ["macros", "rt"] }
