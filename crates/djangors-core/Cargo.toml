[package]
name = "djangors-core"
description = "HTTP kernel for the Djangors web framework"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "http", "router", "kernel"]
categories = ["web-programming", "web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite", "cache", "ws", "resilience", "secrets"]
postgres = ["djangors-orm/postgres", "djangors-db/postgres", "djangors-cache?/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-db/sqlite", "djangors-cache?/sqlite"]
cache = ["dep:djangors-cache"]
ws = []
resilience = ["dep:backon"]
secrets = ["dep:secrecy", "dep:dotenvy", "dep:reqwest"]
debug-panel = []
captcha = ["dep:djangors-forms", "djangors-forms/captcha"]
sentry = ["dep:sentry", "dep:sentry-tracing"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:otel-reqwest",
    "dep:otel-rustls",
]

[dependencies]
sentry = { version = "0.34", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = { version = "0.34", optional = true }
opentelemetry = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", optional = true, default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34", optional = true }
# HTTPS for the OTLP exporter through rustls with the `ring` provider (the one sqlx already
# uses), instead of `reqwest-rustls`, which pulls in aws-lc-rs and needs a C toolchain.
otel-reqwest = { package = "reqwest", version = "0.13.5", optional = true, default-features = false, features = ["rustls-no-provider"] }
otel-rustls = { package = "rustls", version = "0.23.42", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
hyper = { version = "1.10.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service"] }
http-body-util = "0.1.4"
bytes = "1.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
percent-encoding = "2.3.2"
tokio = { version = "1.53.0", features = [
    "net",
    "rt-multi-thread",
    "macros",
    "io-util",
    "signal",
    "time",
    "sync",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
futures-util = "0.3.31"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
    "trace",
    "compression-gzip",
    "compression-br",
    "cors",
    "set-header",
    "normalize-path",
    "request-id",
    "util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
toml = "0.8.20"
async-trait = "0.1.86"
serde_urlencoded = "0.7.1"
multer = "3.1.0"
rand = "0.8.7"
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
# Pure-Rust zlib (miniz_oxide) for the optional compression in `signing::dumps`.
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
djangors-orm = { path = "../djangors-orm", version = "0.12.0", default-features = false }
djangors-db = { path = "../djangors-db", version = "0.12.0", default-features = false }
djangors-cache = { path = "../djangors-cache", version = "0.12.0", default-features = false, optional = true }
djangors-forms = { path = "../djangors-forms", version = "0.12.0", optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"], optional = true }
secrecy = { version = "0.10.3", optional = true }
dotenvy = { version = "0.15.7", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
inventory = "0.3.24"

[dev-dependencies]
djangors-orm = { path = "../djangors-orm" }
djangors-macros = { path = "../djangors-macros" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.0", features = ["test-util"] }
