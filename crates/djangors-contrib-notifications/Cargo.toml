[package]
name = "djangors-contrib-notifications"
description = "Multi-channel notifications (Email, In-App DB Inbox, Webhook, Slack, Discord) with per-user preferences for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "notifications", "email", "webhooks"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-orm/postgres", "djangors-db/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-db/sqlite"]
admin = ["dep:djangors-admin"]

[dependencies]
async-trait = "0.1.86"
chrono = { version = "0.4.45", features = ["std", "serde"] }
djangors-admin = { path = "../djangors-admin", version = "1.0.0", optional = true }
djangors-db = { path = "../djangors-db", version = "1.0.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "1.0.0" }
djangors-mail = { path = "../djangors-mail", version = "1.0.0" }
djangors-orm = { path = "../djangors-orm", version = "1.0.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
