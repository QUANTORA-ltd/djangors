[package]
name = "djangors-cache"
description = "Cache backends and middleware for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "cache", "redis", "moka"]
categories = ["caching"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-db/postgres"]
sqlite = ["djangors-db/sqlite"]
redis = ["dep:redis", "dep:rand"]

[dependencies]
async-trait = "0.1.86"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
djangors-db = { path = "../djangors-db", version = "0.13.0", default-features = false }
http-body-util = "0.1.4"
moka = { version = "0.12.15", features = ["future"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["time", "fs", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
hyper = { version = "1.10.1", features = ["http1"] }
http-body = "1.0.1"
sha2 = "0.10.9"
tracing = "0.1.44"
redis = { version = "1.4.1", features = ["tokio-comp"], optional = true }
rand = { version = "0.8.7", optional = true }

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
