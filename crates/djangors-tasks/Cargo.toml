[package]
name = "djangors-tasks"
description = "Background task queue, #[task] macro, and worker for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "tasks", "background-jobs", "worker"]
categories = ["asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-db/postgres", "djangors-orm/postgres", "djangors-admin/postgres"]
sqlite = ["djangors-db/sqlite", "djangors-orm/sqlite", "djangors-admin/sqlite"]

[dependencies]
djangors-db = { path = "../djangors-db", version = "0.11.0", default-features = false }
djangors-orm = { path = "../djangors-orm", version = "0.11.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "0.11.0" }
djangors-admin = { path = "../djangors-admin", version = "0.11.0", default-features = false }
inventory = "0.3.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["std", "serde"] }
cron = "0.17.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt", "time", "sync", "macros"] }
sqlx = { version = "0.9.0", default-features = false, features = ["chrono"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["full", "rt-multi-thread"] }
