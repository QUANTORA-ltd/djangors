[package]
name = "djangors-contrib-redirects"
description = "Admin-editable database redirects for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "redirects", "routing", "url-redirect"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-admin/postgres", "djangors-core/postgres", "djangors-orm/postgres"]
sqlite = ["djangors-admin/sqlite", "djangors-core/sqlite", "djangors-orm/sqlite"]

[dependencies]
djangors-admin = { path = "../djangors-admin", version = "0.11.0", default-features = false }
djangors-core = { path = "../djangors-core", version = "0.11.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "0.11.0" }
djangors-orm = { path = "../djangors-orm", version = "0.11.0", default-features = false }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
hyper = { version = "1.10.1", features = ["http1"] }
