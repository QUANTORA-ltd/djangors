[package]
name = "djangors-mail"
description = "Minimal mail library for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "email", "mail", "smtp"]
categories = ["email"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["http"]
http = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:hmac", "dep:sha2", "dep:hex", "dep:chrono"]

[dependencies]
async-trait = "0.1.86"
thiserror = "2.0.18"
tracing = "0.1.44"
lettre = { version = "0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
tokio = { version = "1.53.0", features = ["fs", "rt", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }
hmac = { version = "0.12.1", optional = true }
sha2 = { version = "0.10.9", optional = true }
hex = { version = "0.4.3", optional = true }
chrono = { version = "0.4", features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "net", "io-util"] }
