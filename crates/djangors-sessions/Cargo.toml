[package]
name = "djangors-sessions"
description = "Session engines for the Djangors web framework"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "session", "cookies", "hmac"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-core/postgres"]
sqlite = ["djangors-core/sqlite"]

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.11.0", default-features = false }
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
rand = "0.8.7"
tower = { version = "0.5.3", features = ["util"] }
hyper = "1.10.1"
http-body-util = "0.1.4"
bytes = "1.12.1"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
