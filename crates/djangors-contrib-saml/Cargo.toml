[package]
name = "djangors-contrib-saml"
description = "Pure-Rust SAML 2.0 Service Provider single sign-on for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "saml", "sso", "auth"]
categories = ["web-programming", "authentication"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = [
    "djangors-orm/postgres",
    "djangors-core/postgres",
    "djangors-db/postgres",
    "djangors-auth/postgres",
    "djangors-sessions/postgres",
    "djangors-cache/postgres",
]
sqlite = [
    "djangors-orm/sqlite",
    "djangors-core/sqlite",
    "djangors-db/sqlite",
    "djangors-auth/sqlite",
    "djangors-sessions/sqlite",
    "djangors-cache/sqlite",
]
admin = ["dep:djangors-admin"]

[dependencies]
async-trait = "0.1.86"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["std", "serde"] }
der = "0.7.10"
djangors-admin = { path = "../djangors-admin", version = "0.12.0", optional = true }
djangors-auth = { path = "../djangors-auth", version = "0.12.0", default-features = false }
djangors-cache = { path = "../djangors-cache", version = "0.12.0", default-features = false }
djangors-core = { path = "../djangors-core", version = "0.12.0", default-features = false }
djangors-db = { path = "../djangors-db", version = "0.12.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "0.12.0" }
djangors-orm = { path = "../djangors-orm", version = "0.12.0", default-features = false }
djangors-sessions = { path = "../djangors-sessions", version = "0.12.0", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
hyper = "1.10.1"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
quick-xml = "0.40.1"
rand = "0.8.7"
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "sha2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
hyper = { version = "1.10.1", features = ["http1"] }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
