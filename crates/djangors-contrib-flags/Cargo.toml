[package]
name = "djangors-contrib-flags"
description = "Database and cache-backed feature flags and gradual rollouts for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "feature-flags", "rollouts"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite", "cache"]
postgres = ["djangors-orm/postgres", "djangors-db/postgres", "djangors-cache?/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-db/sqlite", "djangors-cache?/sqlite"]
cache = ["dep:djangors-cache"]
admin = ["dep:djangors-admin"]

[dependencies]
async-trait = "0.1.86"
chrono = { version = "0.4.45", features = ["std", "serde"] }
djangors-admin = { path = "../djangors-admin", version = "1.0.0", optional = true }
djangors-cache = { path = "../djangors-cache", version = "1.0.0", default-features = false, optional = true }
djangors-db = { path = "../djangors-db", version = "1.0.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "1.0.0" }
djangors-orm = { path = "../djangors-orm", version = "1.0.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
