[package]
name = "djangors"
description = "The Django of Rust: batteries-included web framework — ORM, migrations, admin, forms, auth."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "orm", "admin", "batteries-included"]
categories = ["web-programming", "web-programming::http-server"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = [
    "postgres",
    "sqlite",
    "migrations",
    "rest",
    "admin",
    "auth",
    "forms",
    "sessions",
    "template",
    "staticfiles",
    "s3",
    "cache",
    "mail",
    "i18n",
    "tasks",
    "pdf",
    "payments",
    "tenancy",
    "history",
    "ws",
    "password-strength",
    "resilience",
]
postgres = [
    "djangors-db/postgres",
    "djangors-orm/postgres",
    "djangors-core/postgres",
    "djangors-migrations?/postgres",
    "djangors-rest?/postgres",
    "djangors-admin?/postgres",
    "djangors-auth?/postgres",
    "djangors-sessions?/postgres",
    "djangors-template?/postgres",
    "djangors-staticfiles?/postgres",
    "djangors-cache?/postgres",
    "djangors-i18n?/postgres",
    "djangors-tasks?/postgres",
    "djangors-contrib-payments?/postgres",
    "djangors-contrib-tenancy?/postgres",
    "djangors-contrib-history?/postgres",
    "djangors-contrib-orgs?/postgres",
]
sqlite = [
    "djangors-db/sqlite",
    "djangors-orm/sqlite",
    "djangors-core/sqlite",
    "djangors-migrations?/sqlite",
    "djangors-rest?/sqlite",
    "djangors-admin?/sqlite",
    "djangors-auth?/sqlite",
    "djangors-sessions?/sqlite",
    "djangors-template?/sqlite",
    "djangors-staticfiles?/sqlite",
    "djangors-cache?/sqlite",
    "djangors-i18n?/sqlite",
    "djangors-tasks?/sqlite",
    "djangors-contrib-payments?/sqlite",
    "djangors-contrib-tenancy?/sqlite",
    "djangors-contrib-history?/sqlite",
    "djangors-contrib-orgs?/sqlite",
]
migrations = ["dep:djangors-migrations"]
rest = ["dep:djangors-rest"]
admin = ["dep:djangors-admin", "djangors-rest?/admin", "djangors-contrib-orgs?/admin"]
auth = ["dep:djangors-auth"]
passkeys = ["auth", "djangors-auth/passkeys"]
password-strength = ["auth", "djangors-auth/password-strength"]
forms = ["dep:djangors-forms"]
captcha = ["forms", "djangors-forms/captcha", "djangors-core/captcha"]
sessions = ["dep:djangors-sessions"]
redis = ["djangors-sessions?/redis", "djangors-cache?/redis"]
template = ["dep:djangors-template"]
staticfiles = ["dep:djangors-staticfiles"]
s3 = ["staticfiles", "djangors-staticfiles/s3"]
cache = ["dep:djangors-cache", "djangors-core/cache"]
mail = ["dep:djangors-mail"]
i18n = ["dep:djangors-i18n"]
tasks = ["dep:djangors-tasks"]
pdf = ["dep:djangors-pdf"]
payments = ["dep:djangors-contrib-payments"]
tenancy = ["dep:djangors-contrib-tenancy"]
history = ["dep:djangors-contrib-history"]
orgs = ["dep:djangors-contrib-orgs"]
ws = ["djangors-core/ws"]
debug-panel = ["djangors-core/debug-panel"]
otel = ["djangors-core/otel"]
resilience = ["djangors-core/resilience"]

[dependencies]
djangors-core = { path = "../djangors-core", version = "0.12.0", default-features = false }
djangors-orm = { path = "../djangors-orm", version = "0.12.0", default-features = false }
djangors-db = { path = "../djangors-db", version = "0.12.0", default-features = false }
djangors-migrations = { path = "../djangors-migrations", version = "0.12.0", default-features = false, optional = true }
djangors-rest = { path = "../djangors-rest", version = "0.12.0", default-features = false, optional = true }
djangors-admin = { path = "../djangors-admin", version = "0.12.0", default-features = false, optional = true }
djangors-auth = { path = "../djangors-auth", version = "0.12.0", default-features = false, optional = true }
djangors-forms = { path = "../djangors-forms", version = "0.12.0", optional = true }
djangors-sessions = { path = "../djangors-sessions", version = "0.12.0", default-features = false, optional = true }
djangors-template = { path = "../djangors-template", version = "0.12.0", default-features = false, optional = true }
djangors-staticfiles = { path = "../djangors-staticfiles", version = "0.12.0", default-features = false, optional = true }
djangors-cache = { path = "../djangors-cache", version = "0.12.0", default-features = false, optional = true }
djangors-mail = { path = "../djangors-mail", version = "0.12.0", optional = true }
djangors-i18n = { path = "../djangors-i18n", version = "0.12.0", default-features = false, optional = true }
djangors-tasks = { path = "../djangors-tasks", version = "0.12.0", default-features = false, optional = true }
djangors-pdf = { path = "../djangors-pdf", version = "0.12.0", optional = true }
djangors-contrib-payments = { path = "../djangors-contrib-payments", version = "0.12.0", default-features = false, optional = true }
djangors-contrib-tenancy = { path = "../djangors-contrib-tenancy", version = "0.12.0", default-features = false, optional = true }
djangors-contrib-history = { path = "../djangors-contrib-history", version = "0.12.0", default-features = false, optional = true }
djangors-contrib-orgs = { path = "../djangors-contrib-orgs", version = "0.12.0", default-features = false, optional = true }
