[package]
name = "djangors-contrib-tenancy"
description = "Multi-tenancy support for Djangors: a Tenant model, membership, and per-request tenant scoping"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "multi-tenancy", "tenant", "saas"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-orm/postgres", "djangors-core/postgres", "djangors-db/postgres", "djangors-auth/postgres", "djangors-rest/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-core/sqlite", "djangors-db/sqlite", "djangors-auth/sqlite", "djangors-rest/sqlite"]

[dependencies]
djangors-macros = { path = "../djangors-macros", version = "0.9.0" }
djangors-orm = { path = "../djangors-orm", version = "0.9.0", default-features = false }
djangors-core = { path = "../djangors-core", version = "0.9.0", default-features = false }
djangors-db = { path = "../djangors-db", version = "0.9.0", default-features = false }
djangors-auth = { path = "../djangors-auth", version = "0.9.0", default-features = false }
djangors-rest = { path = "../djangors-rest", version = "0.9.0", default-features = false }
chrono = { version = "0.4", features = ["std"] }
tower = { version = "0.5.3", features = ["util"] }
hyper = "1.10.1"

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
bytes = "1.12.1"
http-body-util = "0.1.4"
