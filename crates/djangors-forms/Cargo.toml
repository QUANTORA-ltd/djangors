[package]
name = "djangors-forms"
description = "Forms and validation for the Djangors web framework"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "forms", "validation", "html-forms"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
captcha = ["dep:async-trait", "dep:reqwest", "dep:serde"]

[dependencies]
async-trait = { version = "0.1.86", optional = true }
base64 = "0.22.1"
djangors-macros = { path = "../djangors-macros", version = "0.13.0" }
hmac = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.150"
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
