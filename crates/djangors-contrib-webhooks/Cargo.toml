[package]
name = "djangors-contrib-webhooks"
description = "Customer-facing outbound webhooks with HMAC-SHA256 signing, replay-window verification, exponential backoff retries, and 1-click replay for Djangors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "webhooks", "hmac", "retries"]
categories = ["web-programming"]

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-orm/postgres", "djangors-db/postgres"]
sqlite = ["djangors-orm/sqlite", "djangors-db/sqlite"]
admin = ["dep:djangors-admin"]

[dependencies]
chrono = { version = "0.4.45", features = ["std", "serde"] }
djangors-admin = { path = "../djangors-admin", version = "1.0.0", optional = true }
djangors-db = { path = "../djangors-db", version = "1.0.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "1.0.0" }
djangors-orm = { path = "../djangors-orm", version = "1.0.0", default-features = false }
hex = "0.4.3"
hmac = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
subtle = "2.6"
thiserror = "2.0.18"

[dev-dependencies]
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "net", "io-util"] }
