[package]
name = "djangors-contrib-contenttypes"
description = "Content types and generic foreign keys for Djangors"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "contenttypes", "generic-fk", "orm"]
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-db/postgres", "djangors-orm/postgres"]
sqlite = ["djangors-db/sqlite", "djangors-orm/sqlite"]

[dependencies]
djangors-db = { path = "../djangors-db", version = "0.7.0", default-features = false }
djangors-macros = { path = "../djangors-macros", version = "0.7.0" }
djangors-orm = { path = "../djangors-orm", version = "0.7.0", default-features = false }
thiserror = "2.0.18"

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros"] }
