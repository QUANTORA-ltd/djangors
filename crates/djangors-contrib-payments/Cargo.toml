[package]
name = "djangors-contrib-payments"
description = "Payment provider integration (Paystack) for Djangors, with idempotent transaction recording"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "payments", "paystack", "fintech"]
categories = ["finance"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-orm/postgres"]
sqlite = ["djangors-orm/sqlite"]

[dependencies]
djangors-macros = { path = "../djangors-macros", version = "0.11.0" }
djangors-orm = { path = "../djangors-orm", version = "0.11.0", default-features = false }
async-trait = "0.1.86"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["std"] }

[dev-dependencies]
djangors-test = { path = "../djangors-test" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres"] }
wiremock = "0.6"
