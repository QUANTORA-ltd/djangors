[package]
name = "djangors-contrib-grpc"
description = "gRPC integration (tonic) for Djangors with shared AppState and HTTP/gRPC HybridServer"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["django", "web-framework", "grpc", "tonic"]
categories = ["web-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["postgres", "sqlite"]
postgres = ["djangors-core/postgres"]
sqlite = ["djangors-core/sqlite"]

[dependencies]
bytes = "1.12.1"
djangors-core = { path = "../djangors-core", version = "1.1.0", default-features = false }
http-body-util = "0.1.4"
hyper = { version = "1.10.1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio", "service"] }
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["net", "rt-multi-thread", "macros"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server", "codegen"] }
tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
futures-util = "0.3"
http = "1"
hyper = { version = "1.10.1", features = ["client", "http1", "http2"] }
