version: 2.1

jobs:
  test:
    docker:
      - image: cimg/rust:1.96.0
        environment:
          DATABASE_URL: postgres://postgres:postgres@localhost/djangors_test
      - image: cimg/postgres:16.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
    steps:
      - checkout
      - run:
          name: Install rustfmt / clippy components
          command: rustup component add rustfmt clippy
      - restore_cache:
          keys:
            - cargo-registry-{{ checksum "Cargo.lock" }}
      - run:
          name: Wait for Postgres and create test database
          command: |
            for i in $(seq 1 30); do
              PGPASSWORD=postgres psql -h localhost -U postgres -c 'select 1' > /dev/null 2>&1 && break
              sleep 1
            done
            PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE djangors_test;'
            PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE djangors_bench;'
      - run:
          name: Check formatting
          command: cargo fmt --all -- --check
      - run:
          name: Clippy (deny warnings)
          command: cargo clippy --workspace --all-targets -- -D warnings
      - run:
          name: Build
          command: cargo build --workspace --all-targets
      - run:
          name: Test
          command: cargo test --workspace -- --include-ignored
      - run:
          name: Doc build
          command: cargo doc --workspace --no-deps
          environment:
            RUSTDOCFLAGS: "-D warnings"
      - run:
          name: Check minimal facade and single-backend feature combinations
          command: |
            cargo check -p djangors --no-default-features --features postgres
            cargo check -p djangors --no-default-features --features sqlite
            cargo check -p djangors-db --no-default-features --features postgres
            cargo check -p djangors-db --no-default-features --features sqlite
            # Verify backend isolation: a Postgres-only facade build must not pull in SQLite,
            # and a SQLite-only facade build must not pull in sqlx-postgres.
            # Written as `if ...; then exit 1` because `set -e` ignores a `!`-negated
            # pipeline, so `! cmd | grep -q` would never fail the step.
            if cargo tree -p djangors --no-default-features --features postgres -e normal | grep "libsqlite3-sys"; then
              echo "Postgres-only facade build pulls in SQLite" >&2
              exit 1
            fi
            if cargo tree -p djangors --no-default-features --features sqlite -e normal | grep "sqlx-postgres"; then
              echo "SQLite-only facade build pulls in sqlx-postgres" >&2
              exit 1
            fi
      - run:
          name: Measure release binary size
          command: |
            # Build separately: one `cargo build -p a -p b` unifies features across both
            # packages, so minimal-facade would be measured with polls' full feature set.
            cargo build --release -p minimal-facade
            MIN_BYTES=$(stat -c%s target/release/minimal-facade)
            cargo build --release -p polls
            MIN_MIB=$(awk "BEGIN { printf \"%.2f\", $MIN_BYTES / (1024 * 1024) }")
            POLLS_BYTES=$(stat -c%s target/release/polls)
            POLLS_MIB=$(awk "BEGIN { printf \"%.2f\", $POLLS_BYTES / (1024 * 1024) }")
            echo "Release binary size (examples/minimal-facade, postgres-only): ${MIN_MIB} MiB (${MIN_BYTES} bytes)"
            echo "Release binary size (examples/polls, full stack): ${POLLS_MIB} MiB (${POLLS_BYTES} bytes)"
            # Enforce a 6 MiB ceiling on the minimal facade binary (~4.0 MiB baseline)
            # and a 14 MiB ceiling on the full polls binary (~11.5 MiB baseline).
            test "$MIN_BYTES" -lt 6291456
            test "$POLLS_BYTES" -lt 14680064
            test "$MIN_BYTES" -lt "$POLLS_BYTES"
      - save_cache:
          key: cargo-registry-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  test-sqlite:
    docker:
      - image: cimg/rust:1.96.0
    steps:
      - checkout
      - run:
          name: Install rustfmt / clippy components
          command: rustup component add rustfmt clippy
      - restore_cache:
          keys:
            - cargo-sqlite-{{ checksum "Cargo.lock" }}
      # No DATABASE_URL is set anywhere in this job, and that is load-bearing:
      # the test harness selects its backend by checking whether DATABASE_URL is
      # present, so if it leaks into the environment this job silently runs
      # against Postgres and passes while proving nothing about SQLite.
      - run:
          name: Test SQLite backend
          command: env -u DATABASE_URL TEST_BACKEND=sqlite cargo test --workspace
      # Distinct cache key from the `test` job. Sharing one key makes whichever
      # job finishes second fail its save with "cache already exists".
      - save_cache:
          key: cargo-sqlite-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - target

  audit:
    docker:
      - image: cimg/rust:1.96.0
    steps:
      - checkout
      - run:
          name: Install cargo-audit
          command: cargo install cargo-audit --locked
      - run:
          name: Run cargo audit
          # RUSTSEC-2026-0194 / -0195 (quick-xml DoS, transitive via the `s3` crate) and
          # RUSTSEC-2023-0071 (rsa Marvin Attack, only reachable via djangors-rest's optional
          # `jwt` feature) are triaged, currently unfixable upstream, and documented in
          # docs/security-review-2026-07-27.md. Re-run without --ignore periodically to notice
          # when upstream ships a fix.
          command: >-
            cargo audit
            --ignore RUSTSEC-2026-0194
            --ignore RUSTSEC-2026-0195
            --ignore RUSTSEC-2023-0071

workflows:
  version: 2
  build-and-test:
    jobs:
      - test
      - test-sqlite
      - audit
